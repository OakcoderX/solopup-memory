name: Publish npm beta

on:
  push:
    tags: ['v*-beta.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing beta tag; blank uses main for verification only'
        type: string
        required: false
      dry_run:
        description: 'Verify without publishing'
        type: boolean
        default: true
      confirm_unsubmitted:
        description: 'Recovery only: authenticated registry status confirms no prior submission'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Different beta versions must not publish/finalize concurrently.
  group: solopup-memory-beta-release
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ inputs.tag || github.ref_name }}
  RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
  RELEASE_CONFIRM_UNSUBMITTED: ${{ inputs.confirm_unsubmitted && 'true' || 'false' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tests:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test ci/*.test.mjs
      - run: npm test
      - run: node ci/eval-gate.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-gates-${{ runner.os }}
          path: release-gates/
          if-no-files-found: error
          retention-days: 7

  compatibility:
    needs: resolve
    uses: ./.github/workflows/compatibility.yml
    with:
      source_ref: ${{ needs.resolve.outputs.commit }}

  package:
    needs: [resolve, tests, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.21.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: source-gates-*
          path: source-gates/
      - run: node ci/release.mjs prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-npm-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' || inputs.dry_run == false
    needs: [resolve, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install --global npm@11.21.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-npm-release
          path: release/
      - run: node ci/release.mjs publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: submission-state-${{ github.run_attempt }}
          path: release/submission.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-published-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  github-and-market:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-published-release
          path: release/
      - run: node ci/release.mjs finalize
        env:
          GH_TOKEN: ${{ github.token }}

  version-audit:
    needs: [publish, github-and-market]
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-published-release
          path: release/
      - run: node ci/promotion-audit.mjs --receipt-dir release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-beta-version-sync
          path: release/version-sync/
          if-no-files-found: error
          retention-days: 30
